<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Детский сад "Солнышко"</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="logo">
                    <i class="fas fa-sun"></i>
                    <span>Детский сад "Солнышко"</span>
                </div>
                <button class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-menu" id="navMenu">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="events.html">Мероприятия</a></li>
                    <li><a href="staff.html">Педагоги</a></li>
                    <li><a href="pricing.html">Стоимость</a></li>
                    <li><a href="login.html" class="btn-login active">Вход</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-box">
                <h1>Вход в личный кабинет</h1>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Логин</label>
                        <input type="text" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
                </form>
                <p class="auth-link">Нет аккаунта? <a href="#" onclick="toggleForms()">Зарегистрироваться</a></p>
            </div>

            <div class="auth-box" id="registerBox" style="display: none;">
                <h1>Регистрация</h1>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regName">ФИО</label>
                        <input type="text" id="regName" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Пароль</label>
                        <input type="password" id="regPassword" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="regPhone">Телефон</label>
                        <input type="tel" id="regPhone" name="phone" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Зарегистрироваться</button>
                </form>
                <p class="auth-link">Уже есть аккаунт? <a href="#" onclick="toggleForms()">Войти</a></p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>О саде</h3>
                    <p>Детский сад "Солнышко" - место для развития вашего ребенка</p>
                </div>
                <div class="footer-section">
                    <h3>Контакты</h3>
                    <p>Телефон: +7 (999) 123-45-67</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
